<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
    <!-- Буква Е -->
    <text x="140" y="100" font-family="Georgia, serif" font-size="90" font-weight="700" fill="#ffffff" text-anchor="middle">Е</text>
    <!-- Амперсанд -->
    <text x="250" y="100" font-family="Georgia, serif" font-size="52" font-weight="300" fill="#f0c0c0" text-anchor="middle">&amp;</text>
    <!-- Буква Д -->
    <text x="360" y="100" font-family="Georgia, serif" font-size="90" font-weight="700" fill="#ffffff" text-anchor="middle">Д</text>
    <!-- Линия -->
    <line x1="140" y1="130" x2="360" y2="130" stroke="#f0c0c0" stroke-width="3"/>
    <!-- Год -->
    <text x="250" y="160" font-family="Arial, sans-serif" font-size="14" fill="#cccccc" text-anchor="middle" letter-spacing="6">2026</text>
</svg>